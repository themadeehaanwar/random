<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target 70kg: Dec 7 Protocol</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased p-4 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header Section -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 shadow-lg gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i data-lucide="target" class="text-emerald-400"></i> Target 70kg Protocol
        </h1>
        <p class="text-slate-400 text-sm mt-1">Timeline: Sept 1 (82.55kg) → Dec 7 (70.0kg)</p>
      </div>
      <div id="countdown-badge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
        <i data-lucide="calendar"></i> <span id="days-remaining">--</span> Days Remaining
      </div>
    </header>

    <!-- Metrics Overview -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Latest Weight</span>
        <div id="metric-latest" class="text-2xl font-bold text-white mt-1">-- kg</div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Ideal Today</span>
        <div id="metric-ideal" class="text-2xl font-bold text-slate-300 mt-1">-- kg</div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Status</span>
        <div id="metric-status" class="mt-1">
          <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">No Data</span>
        </div>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Total Progress</span>
        <div id="metric-total-loss" class="text-2xl font-bold text-emerald-400 mt-1">-- kg</div>
      </div>
    </div>

    <!-- Daily Input Form -->
    <section class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 shadow-lg">
      <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-emerald-400"></i> Daily Morning Check-in
      </h2>
      <form id="weight-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-slate-300 text-xs mb-1 font-medium">Date</label>
          <input type="date" id="input-date" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500 text-sm" required>
        </div>
        <div>
          <label class="block text-slate-300 text-xs mb-1 font-medium">Actual Weight (kg)</label>
          <input type="number" step="0.05" id="input-weight" placeholder="e.g. 80.5" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500 text-sm" required>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 px-4 rounded-xl transition duration-200 text-sm flex items-center justify-center gap-2">
          <i data-lucide="save"></i> Log Entry
        </button>
      </form>
    </section>

    <!-- Chart Visualization -->
    <section class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 shadow-lg">
      <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
        <i data-lucide="trending-down" class="text-emerald-400"></i> Progress Graph
      </h2>
      <div class="w-full h-72">
        <canvas id="weightChart"></canvas>
      </div>
    </section>

    <!-- Data Table & Management -->
    <section class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
          <i data-lucide="list" class="text-emerald-400"></i> Log History
        </h2>
        <div class="flex gap-2">
          <button id="btn-export" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-600">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
          </button>
          <button id="btn-import-trigger" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-slate-600">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import
          </button>
          <input type="file" id="input-import" class="hidden" accept=".json">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
            <tr>
              <th class="p-3">Date</th>
              <th class="p-3">Actual (kg)</th>
              <th class="p-3">Ideal (kg)</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="history-tbody" class="divide-y divide-slate-700/50">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // Configuration & Protocol Constants
    const START_DATE = new Date('2026-09-01');
    const END_DATE = new Date('2026-12-07');
    const START_WEIGHT = 82.55;
    const END_WEIGHT = 70.00;
    
    // Total Days = 97 days
    const TOTAL_DAYS = Math.round((END_DATE - START_DATE) / (1000 * 60 * 60 * 24));
    const DAILY_DROP = (START_WEIGHT - END_WEIGHT) / TOTAL_DAYS;

    let entries = JSON.parse(localStorage.getItem('weight_tracker_entries') || '[]');
    let chartInstance = null;

    // Calculate Ideal Weight for any given Date string
    function calculateIdealWeight(dateStr) {
      const targetDate = new Date(dateStr);
      const diffDays = Math.round((targetDate - START_DATE) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return START_WEIGHT;
      if (diffDays > TOTAL_DAYS) return END_WEIGHT;
      return +(START_WEIGHT - (diffDays * DAILY_DROP)).toFixed(2);
    }

    // Format Date string nicely
    function formatDate(dateStr) {
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateStr).toLocaleDateString(undefined, options);
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('input-date').valueAsDate = new Date();
      updateCountdown();
      renderDashboard();
    });

    function updateCountdown() {
      const today = new Date();
      const diffTime = END_DATE - today;
      const daysLeft = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
      document.getElementById('days-remaining').textContent = daysLeft;
    }

    // Form Submit Handler
    document.getElementById('weight-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('input-date').value;
      const weight = parseFloat(document.getElementById('input-weight').value);

      if (!date || isNaN(weight)) return;

      const existingIndex = entries.findIndex(e => e.date === date);
      if (existingIndex >= 0) {
        entries[existingIndex].weight = weight;
      } else {
        entries.push({ date, weight });
      }

      entries.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveEntries();
      renderDashboard();
      document.getElementById('input-weight').value = '';
    });

    function deleteEntry(date) {
      entries = entries.filter(e => e.date !== date);
      saveEntries();
      renderDashboard();
    }

    function saveEntries() {
      localStorage.setItem('weight_tracker_entries', JSON.stringify(entries));
    }

    // Main Render Function
    function renderDashboard() {
      renderMetrics();
      renderTable();
      renderChart();
    }

    function renderMetrics() {
      const todayStr = new Date().toISOString().split('T')[0];
      const idealToday = calculateIdealWeight(todayStr);
      document.getElementById('metric-ideal').textContent = `${idealToday} kg`;

      if (entries.length === 0) {
        document.getElementById('metric-latest').textContent = '-- kg';
        document.getElementById('metric-total-loss').textContent = '-- kg';
        document.getElementById('metric-status').innerHTML = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">No Data</span>`;
        return;
      }

      const latest = entries[entries.length - 1];
      document.getElementById('metric-latest').textContent = `${latest.weight} kg`;

      const totalLoss = (START_WEIGHT - latest.weight).toFixed(2);
      document.getElementById('metric-total-loss').textContent = `-${totalLoss} kg`;

      const idealForLatest = calculateIdealWeight(latest.date);
      const diff = +(latest.weight - idealForLatest).toFixed(2);

      let statusHtml = '';
      if (diff <= 0) {
        statusHtml = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">🟢 On Track (${diff}kg)</span>`;
      } else {
        statusHtml = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40">🟡 Retention (+${diff}kg)</span>`;
      }
      document.getElementById('metric-status').innerHTML = statusHtml;
    }

    function renderTable() {
      const tbody = document.getElementById('history-tbody');
      tbody.innerHTML = '';

      if (entries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">No weight check-ins logged yet.</td></tr>`;
        return;
      }

      [...entries].reverse().forEach(entry => {
        const ideal = calculateIdealWeight(entry.date);
        const diff = +(entry.weight - ideal).toFixed(2);
        const isGreen = diff <= 0;

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/40 transition duration-150';
        row.innerHTML = `
          <td class="p-3 font-medium text-white">${formatDate(entry.date)}</td>
          <td class="p-3">${entry.weight} kg</td>
          <td class="p-3 text-slate-400">${ideal} kg</td>
          <td class="p-3">
            ${isGreen 
              ? `<span class="px-2 py-0.5 rounded text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🟢 On Track</span>`
              : `<span class="px-2 py-0.5 rounded text-xs font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30">🟡 Focus Zone (+${diff})</span>`
            }
          </td>
          <td class="p-3 text-right">
            <button onclick="deleteEntry('${entry.date}')" class="text-slate-500 hover:text-red-400 transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
      lucide.createIcons();
    }

    function renderChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      
      // Build date labels spanning from Sept 1 to Dec 7
      let dateLabels = [];
      let idealData = [];
      let actualDataMap = new Map(entries.map(e => [e.date, e.weight]));

      let curr = new Date(START_DATE);
      while (curr <= END_DATE) {
        const dStr = curr.toISOString().split('T')[0];
        dateLabels.push(dStr);
        idealData.push(calculateIdealWeight(dStr));
        curr.setDate(curr.getDate() + 1);
      }

      let actualData = dateLabels.map(dStr => actualDataMap.has(dStr) ? actualDataMap.get(dStr) : null);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dateLabels.map(d => formatDate(d)),
          datasets: [
            {
              label: 'Ideal Weight Track (kg)',
              data: idealData,
              borderColor: '#38bdf8',
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 0,
              fill: false,
              tension: 0.1
            },
            {
              label: 'Actual Weight (kg)',
              data: actualData,
              borderColor: '#10b981',
              backgroundColor: '#10b981',
              borderWidth: 3,
              pointRadius: 4,
              pointHoverRadius: 6,
              spanGaps: true,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8', maxTicksLimit: 8 }
            },
            y: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8' },
              min: 68,
              max: 84
            }
          },
          plugins: {
            legend: { labels: { color: '#e2e8f0' } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label}: ${context.raw} kg`;
                }
              }
            }
          }
        }
      });
    }

    // Export JSON Backup
    document.getElementById('btn-export').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `weight_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Import JSON Backup
    document.getElementById('btn-import-trigger').addEventListener('click', () => {
      document.getElementById('input-import').click();
    });

    document.getElementById('input-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedData = JSON.parse(evt.target.result);
          if (Array.isArray(importedData)) {
            entries = importedData;
            saveEntries();
            renderDashboard();
            alert('Data imported successfully!');
          }
        } catch (err) {
          alert('Invalid JSON backup file.');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
