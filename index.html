<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Surprise Box! 🍄</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #5c94fc;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background-color: #000;
            border: 6px solid #fff;
            padding: 30px;
            box-shadow: 0 10px 0px #000;
        }
        h1 {
            font-size: 16px;
            color: #ffcc00;
            line-height: 1.6;
        }
        p {
            font-size: 9px;
            line-height: 1.8;
        }
        .block-btn {
            display: inline-block;
            width: 90px;
            height: 90px;
            background-color: #fc9838;
            border: 5px solid #000;
            position: relative;
            cursor: pointer;
            box-shadow: inset -6px -6px 0px #a44800, inset 6px 6px 0px #fcffff;
            margin: 20px 0;
        }
        .block-btn::before {
            content: "?";
            font-size: 50px;
            color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .status-box {
            margin-top: 30px;
            padding: 20px;
            border-top: 4px dashed #fff;
            display: none;
            font-size: 10px;
            line-height: 2;
        }
        .copy-btn {
            margin-top: 15px;
            background-color: #4eed4e;
            color: black;
            padding: 10px;
            border: 3px solid #000;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SUPER MARIO BROS.<br>ITEM ACQUISITION</h1>
    <p>A MYSTERY BLOCK HAS SPAWNED!<br>HIT THE BLOCK TO GENERATE YOUR GIFT OUTPOST.</p>
    
    <div class="block-btn" onclick="requestLocationData()"></div>

    <div id="statusMenu" class="status-box"></div>
</div>

<script>
function requestLocationData() {
    const statusMenu = document.getElementById("statusMenu");
    statusMenu.style.display = "block";
    statusMenu.innerHTML = "SEARCHING FOR MAP BEACON...";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(displayCoordinates, handleDisplayError);
    } else {
        statusMenu.innerHTML = "SYSTEM ERROR: GEOLOCATION NOT SUPPORTED.";
    }
}

function displayCoordinates(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const statusMenu = document.getElementById("statusMenu");

    statusMenu.innerHTML = 
        '<p style="color: #ff3333;">STAGE CLEAR! 😜</p>' +
        '<p>COORDINATE DATA ACQUIRED:</p>' +
        '<p>LATITUDE: ' + lat + '<br>LONGITUDE: ' + lon + '</p>' +
        '<textarea id="coordText" style="position:absolute; left:-9999px;">LAT: ' + lat + ', LON: ' + lon + '</textarea>' +
        '<button class="copy-btn" onclick="copyCoords()">COPY COORDINATES</button>';
}

function copyCoords() {
    const copyText = document.getElementById("coordText");
    copyText.select();
    document.execCommand("copy");
    alert("Coordinates copied to clipboard! Paste them to your cousin to complete the reveal.");
}

function handleDisplayError(error) {
    const statusMenu = document.getElementById("statusMenu");
    statusMenu.innerHTML = "❌ REQUEST DENIED. PLEASE ENABLE LOCATION PERMISSIONS AND REFRESH.";
}
</script>

</body>
</html>
