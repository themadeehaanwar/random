<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13in13 Protocol Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased p-3 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- Header Section with Days Timeline Progress Bar -->
    <header class="bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
      <div class="flex justify-between items-center gap-2">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
            <i data-lucide="zap" class="text-emerald-400 w-5 h-5 sm:w-6 sm:h-6"></i> 13in13 Protocol
          </h1>
          <p class="text-slate-400 text-xs mt-0.5">Sept 1 (82.55kg) → Dec 7 (70.00kg)</p>
        </div>
        <div class="text-right text-xs sm:text-sm font-semibold text-emerald-400 whitespace-nowrap">
          <span id="progress-text">0.0% Time</span>
        </div>
      </div>

      <!-- Line Progress Bar with Moving Indicator Dot -->
      <div class="space-y-1.5">
        <div class="relative w-full h-2.5 bg-slate-700/70 rounded-full flex items-center">
          <div id="progress-fill" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%;"></div>
          <div id="progress-dot" class="absolute w-4 h-4 bg-emerald-400 border-2 border-slate-900 rounded-full shadow-md transition-all duration-500 -ml-2" style="left: 0%;"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-400 font-medium pt-0.5">
          <span id="days-elapsed">Day 0 of 97</span>
          <span id="days-remaining">97 Days Remaining</span>
        </div>
      </div>
    </header>

    <!-- Today's Status Banner -->
    <div class="bg-slate-800/80 px-4 py-3 rounded-2xl border border-slate-700/60 shadow-lg flex items-center justify-between gap-2">
      <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="activity" class="w-4 h-4 text-emerald-400"></i> Today's Status
      </span>
      <div id="metric-status" class="whitespace-nowrap">
        <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">Calculating...</span>
      </div>
    </div>

    <!-- Side-by-Side Weights Grid (2 Columns on Mobile) -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/60 p-3.5 sm:p-4 rounded-2xl border border-slate-700/50">
        <span class="text-slate-400 text-[11px] sm:text-xs uppercase tracking-wider font-semibold block">Latest Weight</span>
        <div id="metric-latest" class="text-xl sm:text-2xl font-bold text-white mt-1">-- kg</div>
      </div>
      <div class="bg-slate-800/60 p-3.5 sm:p-4 rounded-2xl border border-slate-700/50">
        <span class="text-slate-400 text-[11px] sm:text-xs uppercase tracking-wider font-semibold block">Ideal Today</span>
        <div id="metric-ideal" class="text-xl sm:text-2xl font-bold text-slate-300 mt-1">-- kg</div>
      </div>
    </div>

    <!-- Total Weight Progress Bar Card -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/60 shadow-lg space-y-2">
      <div class="flex justify-between items-center text-xs font-semibold">
        <span class="text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="target" class="w-4 h-4 text-emerald-400"></i> Total Weight Progress
        </span>
        <span id="weight-loss-text" class="text-emerald-400 font-bold">-0.00 / -12.55 kg (0%)</span>
      </div>
      <div class="w-full h-2.5 bg-slate-700/70 rounded-full overflow-hidden">
        <div id="weight-progress-fill" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Daily Check-in Form (Strict Single Row) -->
    <section class="bg-slate-800/80 p-3 sm:p-4 rounded-2xl border border-slate-700/60 shadow-lg">
      <form id="weight-form" class="flex flex-row gap-2 items-center">
        <input type="date" id="input-date" class="w-[42%] bg-slate-900 border border-slate-700 text-white rounded-xl px-2.5 py-2 focus:outline-none focus:border-emerald-500 text-xs sm:text-sm font-medium shrink-0" required>
        <input type="number" step="0.05" id="input-weight" placeholder="Weight (kg)" class="w-[38%] bg-slate-900 border border-slate-700 text-white rounded-xl px-2.5 py-2 focus:outline-none focus:border-emerald-500 text-xs sm:text-sm font-medium shrink-0" required>
        <button type="submit" class="w-[20%] bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 px-2 rounded-xl transition duration-200 text-xs sm:text-sm flex items-center justify-center gap-1 shrink-0">
          <i data-lucide="save" class="w-3.5 h-3.5"></i> Save
        </button>
      </form>
    </section>

    <!-- Progress Graph -->
    <section class="bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-700/60 shadow-lg">
      <h2 class="text-base sm:text-lg font-semibold text-white mb-3 flex items-center gap-2">
        <i data-lucide="trending-down" class="text-emerald-400 w-4 h-4 sm:w-5 sm:h-5"></i> 13in13 Progress Graph
      </h2>
      <div class="w-full h-64 sm:h-72">
        <canvas id="weightChart"></canvas>
      </div>
    </section>

    <!-- History Log Table -->
    <section class="bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base sm:text-lg font-semibold text-white flex items-center gap-2">
          <i data-lucide="list" class="text-emerald-400 w-4 h-4 sm:w-5 sm:h-5"></i> History Log
        </h2>
        <div class="flex gap-2">
          <button id="btn-export" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1 border border-slate-600">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
          </button>
          <button id="btn-import-trigger" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1 border border-slate-600">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import
          </button>
          <input type="file" id="input-import" class="hidden" accept=".json">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/60 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-700">
            <tr>
              <th class="p-2 sm:p-3 whitespace-nowrap">Date</th>
              <th class="p-2 sm:p-3 whitespace-nowrap">Actual</th>
              <th class="p-2 sm:p-3 whitespace-nowrap">Ideal</th>
              <th class="p-2 sm:p-3 whitespace-nowrap">Status</th>
            </tr>
          </thead>
          <tbody id="history-tbody" class="divide-y divide-slate-700/50">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // Protocol Configuration
    const START_DATE = new Date('2026-09-01');
    const END_DATE = new Date('2026-12-07');
    const START_WEIGHT = 82.55;
    const END_WEIGHT = 70.00;
    
    // Total Protocol Days = 97
    const TOTAL_DAYS = Math.round((END_DATE - START_DATE) / (1000 * 60 * 60 * 24));
    const DAILY_DROP = (START_WEIGHT - END_WEIGHT) / TOTAL_DAYS;

    // Pre-loaded Baseline Data
    const DEFAULT_HISTORY = [
      { date: '2026-08-31', weight: 82.95 },
      { date: '2026-09-01', weight: 82.55 },
      { date: '2026-09-02', weight: 81.90 },
      { date: '2026-09-03', weight: 82.10 },
      { date: '2026-09-04', weight: 82.55 },
      { date: '2026-09-05', weight: 82.05 },
      { date: '2026-09-06', weight: 81.65 },
      { date: '2026-09-07', weight: 81.65 },
      { date: '2026-09-08', weight: 81.80 },
      { date: '2026-09-09', weight: 81.75 },
      { date: '2026-09-10', weight: 81.10 },
      { date: '2026-09-11', weight: 80.70 },
      { date: '2026-09-12', weight: 80.80 },
      { date: '2026-09-13', weight: 80.25 },
      { date: '2026-09-14', weight: 80.20 },
      { date: '2026-09-15', weight: 80.05 },
      { date: '2026-09-16', weight: 81.45 },
      { date: '2026-09-17', weight: 80.90 },
      { date: '2026-09-18', weight: 81.45 },
      { date: '2026-09-19', weight: 81.75 },
      { date: '2026-09-20', weight: 81.70 },
      { date: '2026-09-21', weight: 80.70 },
      { date: '2026-09-22', weight: 81.25 },
      { date: '2026-09-23', weight: 80.95 }
    ];

    let storedData = localStorage.getItem('13in13_tracker_entries');
    let entries = storedData ? JSON.parse(storedData) : DEFAULT_HISTORY;

    let chartInstance = null;

    function calculateIdealWeight(dateStr) {
      const targetDate = new Date(dateStr);
      const diffDays = Math.round((targetDate - START_DATE) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return START_WEIGHT;
      if (diffDays > TOTAL_DAYS) return END_WEIGHT;
      return +(START_WEIGHT - (diffDays * DAILY_DROP)).toFixed(2);
    }

    function formatDate(dateStr) {
      const options = { month: 'short', day: 'numeric' };
      return new Date(dateStr).toLocaleDateString(undefined, options);
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('input-date').valueAsDate = new Date();
      updateProgressBar();
      renderDashboard();
    });

    function updateProgressBar() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const startDate = new Date(START_DATE);
      startDate.setHours(0, 0, 0, 0);

      const diffDays = Math.round((today - startDate) / (1000 * 60 * 60 * 24));
      const daysPassed = Math.max(0, Math.min(TOTAL_DAYS, diffDays));
      const daysLeft = Math.max(0, TOTAL_DAYS - daysPassed);
      const pct = Math.min(100, Math.max(0, (daysPassed / TOTAL_DAYS) * 100)).toFixed(1);

      document.getElementById('progress-text').textContent = `${pct}% Time`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
      document.getElementById('progress-dot').style.left = `${pct}%`;
      document.getElementById('days-elapsed').textContent = `Day ${daysPassed} of ${TOTAL_DAYS}`;
      document.getElementById('days-remaining').textContent = `${daysLeft} Days Remaining`;
    }

    document.getElementById('weight-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('input-date').value;
      const weight = parseFloat(document.getElementById('input-weight').value);

      if (!date || isNaN(weight)) return;

      const existingIndex = entries.findIndex(e => e.date === date);
      if (existingIndex >= 0) {
        entries[existingIndex].weight = weight;
      } else {
        entries.push({ date, weight });
      }

      entries.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveEntries();
      renderDashboard();
      document.getElementById('input-weight').value = '';
    });

    function saveEntries() {
      localStorage.setItem('13in13_tracker_entries', JSON.stringify(entries));
    }

    function renderDashboard() {
      renderMetrics();
      renderTable();
      renderChart();
    }

    function renderMetrics() {
      const todayStr = new Date().toISOString().split('T')[0];
      const idealToday = calculateIdealWeight(todayStr);
      document.getElementById('metric-ideal').textContent = `${idealToday} kg`;

      if (entries.length === 0) {
        document.getElementById('metric-latest').textContent = '-- kg';
        document.getElementById('metric-status').innerHTML = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">No Data</span>`;
        document.getElementById('weight-loss-text').textContent = `-0.00 / -12.55 kg (0%)`;
        document.getElementById('weight-progress-fill').style.width = `0%`;
        return;
      }

      const latest = entries[entries.length - 1];
      document.getElementById('metric-latest').textContent = `${latest.weight} kg`;

      // Total Weight Progress Calculations
      const totalTargetLoss = +(START_WEIGHT - END_WEIGHT).toFixed(2); // 12.55 kg
      const currentLoss = +(START_WEIGHT - latest.weight).toFixed(2); // e.g. 1.60 kg
      const weightPct = Math.min(100, Math.max(0, (currentLoss / totalTargetLoss) * 100)).toFixed(1);

      document.getElementById('weight-loss-text').textContent = `-${currentLoss.toFixed(2)} / -${totalTargetLoss} kg (${weightPct}%)`;
      document.getElementById('weight-progress-fill').style.width = `${weightPct}%`;

      const idealForLatest = calculateIdealWeight(latest.date);
      const diff = +(latest.weight - idealForLatest).toFixed(2);

      let statusHtml = '';
      if (diff <= 0) {
        statusHtml = `<span class="px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">🟢 On Track (${diff} kg)</span>`;
      } else {
        statusHtml = `<span class="px-3 py-1 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40">🟡 Retention (+${diff} kg)</span>`;
      }
      document.getElementById('metric-status').innerHTML = statusHtml;
    }

    function renderTable() {
      const tbody = document.getElementById('history-tbody');
      tbody.innerHTML = '';

      if (entries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500 italic">No weight check-ins logged yet.</td></tr>`;
        return;
      }

      [...entries].reverse().forEach(entry => {
        const ideal = calculateIdealWeight(entry.date);
        const diff = +(entry.weight - ideal).toFixed(2);
        const isGreen = diff <= 0;

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/40 transition duration-150';
        row.innerHTML = `
          <td class="p-2 sm:p-3 font-medium text-white whitespace-nowrap">${formatDate(entry.date)}</td>
          <td class="p-2 sm:p-3 whitespace-nowrap">${entry.weight} kg</td>
          <td class="p-2 sm:p-3 text-slate-400 whitespace-nowrap">${ideal} kg</td>
          <td class="p-2 sm:p-3 whitespace-nowrap">
            ${isGreen 
              ? `<span class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 whitespace-nowrap">🟢 On Track</span>`
              : `<span class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30 whitespace-nowrap">🟡 Retention (+${diff})</span>`
            }
          </td>
        `;
        tbody.appendChild(row);
      });
      lucide.createIcons();
    }

    function renderChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      
      let dateLabels = [];
      let idealData = [];
      let actualDataMap = new Map(entries.map(e => [e.date, e.weight]));

      let curr = new Date(START_DATE);
      while (curr <= END_DATE) {
        const dStr = curr.toISOString().split('T')[0];
        dateLabels.push(dStr);
        idealData.push(calculateIdealWeight(dStr));
        curr.setDate(curr.getDate() + 1);
      }

      let actualData = dateLabels.map(dStr => actualDataMap.has(dStr) ? actualDataMap.get(dStr) : null);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dateLabels.map(d => formatDate(d)),
          datasets: [
            {
              label: '13in13 Target (kg)',
              data: idealData,
              borderColor: '#38bdf8',
              borderWidth: 1.5,
              borderDash: [4, 4],
              pointRadius: 0,
              fill: false,
              tension: 0.1
            },
            {
              label: 'Actual Weight (kg)',
              data: actualData,
              borderColor: '#10b981',
              backgroundColor: '#10b981',
              borderWidth: 2,
              pointRadius: 2.5,
              pointHoverRadius: 5,
              spanGaps: true,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8', maxTicksLimit: 10 }
            },
            y: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8' },
              min: 68,
              max: 84
            }
          },
          plugins: {
            legend: { labels: { color: '#e2e8f0' } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label}: ${context.raw} kg`;
                }
              }
            }
          }
        }
      });
    }

    // Export JSON Backup
    document.getElementById('btn-export').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `13in13_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Import JSON Backup
    document.getElementById('btn-import-trigger').addEventListener('click', () => {
      document.getElementById('input-import').click();
    });

    document.getElementById('input-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedData = JSON.parse(evt.target.result);
          if (Array.isArray(importedData)) {
            entries = importedData;
            saveEntries();
            renderDashboard();
            alert('13in13 data imported successfully!');
          }
        } catch (err) {
          alert('Invalid JSON backup file.');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
